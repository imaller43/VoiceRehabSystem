<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Voice Rehabilitation System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-bg: #221D3A; --header-text: #FFFFFF; --body-bg: #f4f7f6;
            --text-primary: #1F1B2F; --text-secondary: #7F8C8D; --accent-teal: #37BC9B;
            --accent-yellow: #FFD600; --card-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--body-bg); height: 100vh; display: flex; flex-direction: column; }
        
        .top-bar { display: flex; justify-content: flex-end; padding: 20px 40px; }
        .lang-selector { background: white; color: var(--text-primary); border: 1px solid #ccc; padding: 8px 12px; border-radius: 6px; font-family: 'Poppins', sans-serif; cursor: pointer; outline: none; }
        
        .login-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .yellow-backdrop { position: absolute; width: 450px; height: 500px; background-color: var(--accent-yellow); border-radius: 40px; transform: rotate(5deg); z-index: 0; box-shadow: var(--card-shadow); transition: 0.3s; }
        .login-card { background: white; padding: 50px 40px; border-radius: 16px; box-shadow: var(--card-shadow); text-align: center; width: 100%; max-width: 400px; z-index: 10; display: flex; flex-direction: column; gap: 20px; }
        
        .logo-icon { width: 60px; height: 60px; background-color: var(--header-bg); color: white; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; margin: 0 auto; }
        .title { font-size: 22px; font-weight: 600; color: var(--text-primary); line-height: 1.4; }
        
        .input-group { display: flex; flex-direction: column; text-align: left; gap: 8px; }
        .input-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .name-input { padding: 12px 15px; border: 2px solid #e1e8ed; border-radius: 8px; font-size: 15px; font-family: 'Poppins', sans-serif; transition: border-color 0.3s; }
        .name-input:focus { border-color: var(--accent-teal); outline: none; }
        
        .btn-submit { background-color: var(--header-bg); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; font-family: 'Poppins', sans-serif;}
        .btn-submit:hover { background-color: #1a162c; }
        
        .status-msg { font-size: 13px; font-weight: 500; color: var(--accent-teal); min-height: 20px;}
        
        .toggle-links { font-size: 13px; margin-top: 10px; color: var(--text-secondary); display: flex; justify-content: space-between; }
        .toggle-links span { cursor: pointer; color: var(--accent-teal); font-weight: 600; }
        .toggle-links span:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="langSelect" class="lang-selector">
            <option value="ms">Bahasa Melayu</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="login-wrapper">
        <div class="yellow-backdrop"></div>
        <div class="login-card">
            <div class="logo-icon">🎙️</div>
            <h1 class="title" id="titleText" data-i18n="loginWelcome">Selamat Datang ke Sistem Pemulihan Suara</h1>
            
            <div class="input-group">
                <label class="input-label" data-i18n="loginPrompt">Sila Masukkan Nama Anda</label>
                <input type="text" id="nameInput" class="name-input" placeholder="Username" autocomplete="off" required>
            </div>

            <div class="input-group">
                <label class="input-label" data-i18n="loginPass">Sila Masukkan Kata Laluan</label>
                <input type="password" id="passInput" class="name-input" placeholder="Password" autocomplete="off" required>
            </div>
            
            <div class="status-msg" id="statusMsg"></div>
            
            <button id="actionBtn" class="btn-submit" data-i18n="loginBtn" onclick="submitForm()">Log Masuk</button>

            <div class="toggle-links">
                <span id="leftToggle" data-i18n="btnRegisterTab" onclick="switchMode('register')">Belum ada akaun? Daftar</span>
                <span id="rightToggle" data-i18n="btnForgotTab" onclick="switchMode('reset')">Lupa Kata Laluan?</span>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script>
        let currentLang = localStorage.getItem('appLang') || 'ms';
        const langSelect = document.getElementById('langSelect');
        langSelect.value = currentLang;

        let currentMode = 'login'; // Mode: login, register, reset

        function updateLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            localStorage.setItem('appLang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
        }
        updateLanguage(currentLang);
        langSelect.addEventListener('change', (e) => updateLanguage(e.target.value));

        function switchMode(mode) {
            currentMode = mode;
            const actionBtn = document.getElementById('actionBtn');
            const leftToggle = document.getElementById('leftToggle');
            const rightToggle = document.getElementById('rightToggle');
            document.getElementById('statusMsg').innerText = "";

            if (mode === 'register') {
                actionBtn.setAttribute('data-i18n', 'btnRegister');
                leftToggle.setAttribute('data-i18n', 'btnLoginTab');
                leftToggle.setAttribute('onclick', "switchMode('login')");
                rightToggle.style.display = 'none';
            } else if (mode === 'reset') {
                actionBtn.setAttribute('data-i18n', 'btnReset');
                leftToggle.setAttribute('data-i18n', 'btnLoginTab');
                leftToggle.setAttribute('onclick', "switchMode('login')");
                rightToggle.style.display = 'none';
            } else {
                actionBtn.setAttribute('data-i18n', 'loginBtn');
                leftToggle.setAttribute('data-i18n', 'btnRegisterTab');
                leftToggle.setAttribute('onclick', "switchMode('register')");
                rightToggle.style.display = 'inline';
            }
            updateLanguage(currentLang);
        }

        async function submitForm() {
            const userName = document.getElementById('nameInput').value.trim();
            const password = document.getElementById('passInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!userName || !password) {
                statusMsg.innerText = currentLang === 'ms' ? "Sila isi semua ruang." : "Please fill in all fields.";
                statusMsg.style.color = "#E74C3C"; return;
            }

            statusMsg.innerText = translations[currentLang].loginProcessing;
            statusMsg.style.color = "#37BC9B";

            let apiEndpoint = "http://127.0.0.1:5000/api/login";
            let payload = { username: userName, password: password };

            if (currentMode === 'register') apiEndpoint = "http://127.0.0.1:5000/api/register";
            else if (currentMode === 'reset') {
                apiEndpoint = "http://127.0.0.1:5000/api/reset_password";
                payload = { username: userName, new_password: password };
            }

            try {
                const response = await fetch(apiEndpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    if (currentMode === 'login') {
                        localStorage.setItem('currentUser', userName);
                        window.location.href = 'index.html';
                    } else {
                        alert(currentLang === 'ms' ? "Berjaya!" : "Success!");
                        switchMode('login');
                    }
                } else {
                    statusMsg.innerText = data.error || "Ralat Pangkalan Data";
                    statusMsg.style.color = "#E74C3C";
                }
            } catch (error) {
                statusMsg.innerText = currentLang === 'ms' ? "Ralat Sambungan Pelayan AI" : "AI Server Connection Error";
                statusMsg.style.color = "#E74C3C";
            }
        }
    </script>
</body>
</html>
